[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "fastplot"
dynamic = ["version"]             # from git: see [tool.setuptools_scm]
description = "Weather maps (matplotlib + cartopy's API) drawn by numba on every core or CUDA on the GPU, 10-100x faster"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "numba>=0.57", "Pillow>=10.1"]
keywords = ["plotting", "maps", "weather", "meteorology", "cartopy", "matplotlib", "gpu", "numba"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
test = ["pytest", "matplotlib", "cartopy", "contourpy"]

[tool.setuptools]
packages = ["fastplot"]
license-files = ["LICENSE", "NOTICE"]

# The version comes from git: v0.2.0 on a tagged commit, 0.2.1.devN+g<hash> on the
# Nth commit after it -- so every commit is newer than the last to pip, and
# `pip install -U git+https://github.com/Rochy111/fastplot` upgrades.
[tool.setuptools_scm]
version_file = "fastplot/_version.py"
fallback_version = "0.2.0"        # a source archive without git

[tool.setuptools.package-data]
fastplot = ["data/*.npz", "data/*.pkl", "data/fonts/*", "data/stylelib/*.mplstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
