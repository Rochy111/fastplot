name: release

# Pushing a tag vX.Y.Z on main makes the GitHub release: the tests run again
# on every system, then the release is published with that version's
# CHANGELOG section as its notes. The docs site is rebuilt by docs.yml when
# the release reaches main.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # main and the tags

      - name: Check the tag and find its notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"; exit 1
          fi
          awk -v v="$version" 'index($0, "## " v " ") == 1 {f = 1; next}
                               /^## / && f {exit} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "fastplot ${GITHUB_REF_NAME#v}" --notes-file notes.md
