site_name: fastplot
site_description: Weather maps and scientific plots with matplotlib's and cartopy's interface, drawn with numba on every CPU core or with CUDA.
site_url: https://rochy111.github.io/fastplot/
repo_url: https://github.com/Rochy111/fastplot
repo_name: Rochy111/fastplot
edit_uri: edit/main/docs/
copyright: fastplot is released under the MIT licence.

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Light theme
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/earth
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Rochy111/fastplot

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [docs/examples, .]
      check_paths: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Gallery:
      - gallery/index.md
      - Atmospheric dynamics:
          - gallery/dynamic_tropopause.md
          - gallery/qg_forcing.md
          - gallery/warm_conveyor.md
      - Storms:
          - gallery/hafs_milton.md
          - gallery/tornado_tracks.md
      - Maps:
          - gallery/surface_analysis.md
          - gallery/station_analysis.md
          - gallery/projections.md
      - Observations:
          - gallery/sounding.md
          - gallery/meteogram.md
          - gallery/wind_rose.md
  - User guide:
      - Maps: guide/maps.md
      - Plots: guide/plots.md
      - Soundings and hodographs: guide/soundings.md
      - Many frames: guide/frames.md
      - CPU, GPU and threads: guide/hardware.md
  - Reference:
      - Supported API: reference/supported.md
      - Differences from matplotlib: reference/differences.md
      - Settings: reference/settings.md
      - Changelog: changelog.md
  - Performance: speed.md
  - Development:
      - Contributing: development.md
      - Internals: internals.md

not_in_nav: |
  examples/data/README.md
